name: Dependabot auto-merge (reusable)

# Enables GitHub native auto-merge on dependabot patch/minor/security PRs. GitHub
# itself holds the PR until the repo's required check (build-and-test, or the repo's
# CI check) passes, then merges. The workflow does not read check state, so there is
# no token-permission dependency. Major bumps are left for a human.

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Hold major version bumps for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          URL: ${{ github.event.pull_request.html_url }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          NEWV: ${{ steps.meta.outputs.new-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$URL" --body "Auto-merge skipped, MAJOR version bump ($NAMES to $NEWV). Majors can break things, so a human should review this. Patch, minor, and security updates auto-merge once CI passes."

      - name: Enable native auto-merge for patch / minor / security
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "$URL"
